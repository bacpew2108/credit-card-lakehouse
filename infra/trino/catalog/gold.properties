# Tầng gold: warehouse gold trong Lakekeeper, dữ liệu trên bucket s3://gold (tài khoản MinIO trino: chỉ đọc)
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://lakekeeper:8181/catalog
iceberg.rest-catalog.warehouse=gold
iceberg.file-format=PARQUET
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=trino
s3.aws-secret-key=${ENV:MINIO_SECRET_TRINO}
# Bronze, Silver, Gold do Spark ghi; qua Trino chỉ đọc
iceberg.security=read_only
