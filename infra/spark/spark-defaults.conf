# Cấu hình của spark-connect (driver thường trực) trên cụm standalone (mục 8–9 Design Doc).
# Job trong Airflow là client Spark Connect, mỗi lần chạy là một session riêng trên driver này,
# các session dùng chung executor đã cấp. Thông tin đăng nhập S3 lấy từ biến môi trường
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (đặt ở spark-connect và spark-worker).
spark.master                                   spark://spark-master:7077
spark.driver.memory                            1g
spark.executor.memory                          1536m
# Chỉ giữ executor khi có job: rảnh 60 giây thì trả bộ nhớ cho worker
spark.dynamicAllocation.enabled                true
spark.dynamicAllocation.shuffleTracking.enabled true
spark.dynamicAllocation.shuffleTracking.timeout 120s
spark.dynamicAllocation.minExecutors           0
spark.dynamicAllocation.maxExecutors           1
spark.dynamicAllocation.executorIdleTimeout    60s
spark.sql.session.timeZone                     UTC
spark.ui.showConsoleProgress                   false
spark.sql.shuffle.partitions                   8

spark.sql.extensions                           org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.defaultCatalog                       lakehouse
spark.sql.catalog.lakehouse                    org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse.type               rest
spark.sql.catalog.lakehouse.uri                http://lakekeeper:8181/catalog
spark.sql.catalog.lakehouse.warehouse          lakehouse
spark.sql.catalog.lakehouse.io-impl            org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lakehouse.s3.endpoint        http://minio:9000
spark.sql.catalog.lakehouse.s3.path-style-access true
spark.sql.catalog.lakehouse.client.region      us-east-1
